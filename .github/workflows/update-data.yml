name: Actualizar datos de rutas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-route-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth openpyxl

      - name: Generar data.json desde Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python scripts/update_data.py

      - name: Publicar cambios
        run: |
          git config user.name "control-rutas-bot"
          git config user.email "control-rutas-bot@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- data.json)" ]; then
            echo "No hay cambios en data.json"
            exit 0
          fi

          git add data.json
          git commit -m "Actualizar datos de rutas"
          git push
