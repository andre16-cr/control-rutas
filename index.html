<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Rutas</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f4f6f8;
  color:#17212b;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif
}
.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding-bottom:75px
}
header{
  background:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:5;
  border-bottom:1px solid #e2e7ec
}
h1{font-size:20px;margin:0 0 12px}
.row{display:flex;gap:8px}
select,button{
  font:inherit;
  border:1px solid #dfe5ea;
  border-radius:10px;
  background:white;
  padding:10px 12px
}
select{flex:1}
button{cursor:pointer}
main{padding:16px}
.card{
  background:white;
  border:1px solid #e2e7ec;
  border-radius:15px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 10px #0000000a
}
.hero{text-align:center}
.total{font-size:38px;font-weight:800}
.muted{color:#687582;font-size:12px}
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:15px
}
.stat{
  text-align:left;
  border:1px solid #e2e7ec;
  border-radius:11px;
  padding:11px
}
.stat b{font-size:23px;display:block}
.progress{
  height:8px;
  background:#e9edf1;
  border-radius:20px;
  margin-top:9px;
  overflow:hidden
}
.progress div{height:100%;background:#238636}
h2{font-size:15px;margin:18px 2px 9px}
.driver{cursor:pointer}
.driverHead{
  display:flex;
  justify-content:space-between;
  font-weight:800
}
.bar{
  height:7px;
  background:#e9edf1;
  border-radius:20px;
  overflow:hidden;
  margin:8px 0
}
.bar div{height:100%;background:#2878c8}
.meta{font-size:12px;color:#687582}
.chips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:12px
}
.point{border-left:4px solid #2878c8}
.point.done{border-left-color:#238636}
.point.transfer{border-left-color:#d88917}
.point b{display:block}
.badge{
  padding:3px 7px;
  border-radius:20px;
  background:#eef2f5;
  font-weight:700
}
.urgent{background:#fdeaea;color:#a82f2f}
.error{
  background:#fff4f4;
  border:1px solid #f0b8b8;
  color:#8f2424
}
.loading{text-align:center;padding:32px 12px}
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #e2e7ec;
  z-index:10
}
.nav{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr)
}
nav button{
  border:0;
  border-radius:0;
  padding:9px;
  color:#687582
}
nav button.active{
  color:#17212b;
  font-weight:800
}
.view{display:none}
.view.active{display:block}
.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:12px
}
.toolbar>*{flex:1}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>🚚 Control de Rutas</h1>

  <div class="row">
    <select id="date"></select>
    <button id="refreshBtn" onclick="loadData(true)">↻ Actualizar</button>
  </div>

  <div id="updated" class="muted" style="margin-top:6px"></div>
</header>

<main>
  <section id="summary" class="view active">
    <div class="card loading">Cargando datos...</div>
  </section>

  <section id="routes" class="view"></section>

  <section id="urgencies" class="view"></section>
</main>

</div>

<nav>
  <div class="nav">
    <button class="active" onclick="view('summary',this)">🏠<br>Resumen</button>
    <button onclick="view('routes',this)">🚚<br>Rutas</button>
    <button onclick="view('urgencies',this)">🚨<br>Urgencias</button>
  </div>
</nav>

<script>
const summaryEl = document.getElementById("summary");
const routesEl = document.getElementById("routes");
const urgenciesEl = document.getElementById("urgencies");
const updatedEl = document.getElementById("updated");
const dateEl = document.getElementById("date");
const refreshBtn = document.getElementById("refreshBtn");

let allRecords = [];
let raw = [];
let payload = null;
let selectedDate = "";
let currentDriverFilter = "";
let currentStateFilter = "TODOS";

function esc(s){
  return String(s ?? "").replace(/[&<>]/g,x=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;"
  }[x]));
}

function pct(a,b){
  return b ? (a/b*100).toFixed(1) : "0.0";
}

function formatDateLabel(iso){
  if(!iso) return "";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;

  const d = new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2])
  );

  return new Intl.DateTimeFormat(
    "es-CR",
    {
      weekday:"short",
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  ).format(d).toUpperCase();
}

function formatShortDate(iso){
  if(!iso) return iso;
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function formatTimestamp(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return value;

  return new Intl.DateTimeFormat(
    "es-CR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  ).format(d);
}

function M(a){
  return {
    t:a.length,
    d:a.filter(x=>x.estado==="COMPLETADO").length,
    p:a.filter(x=>x.estado==="PENDIENTE").length,
    tr:a.filter(x=>x.estado==="TRASLADO").length,
    u:a.filter(x=>x.urgencia).length,
    ud:a.filter(x=>x.urgencia && x.estado==="COMPLETADO").length,
    up:a.filter(x=>x.urgencia && x.estado==="PENDIENTE").length,
    utr:a.filter(x=>x.urgencia && x.estado==="TRASLADO").length
  };
}

function point(x){
  const css =
    x.estado==="COMPLETADO"
      ? "done"
      : x.estado==="TRASLADO"
      ? "transfer"
      : "";

  return `
    <div class="card point ${css}">
      <b>${esc(x.lugar || "(Sin lugar)")}</b>
      → ${esc(x.destino || "(Sin destino)")}

      <div class="chips">
        <span class="badge">${esc(x.estado)}</span>

        ${
          x.urgencia
            ? '<span class="badge urgent">🚨 URGENCIA</span>'
            : ""
        }

        ${
          x.ubicacion
            ? `<span>📍 ${esc(x.ubicacion)}</span>`
            : ""
        }

        ${
          x.compromiso
            ? `<span>⏰ ${esc(x.compromiso)}</span>`
            : ""
        }
      </div>

      ${
        x.observaciones
          ? `<div class="meta" style="margin-top:8px">📝 ${esc(x.observaciones)}</div>`
          : ""
      }
    </div>
  `;
}

function buildDateSelector(){
  const dates = [
    ...new Set(
      allRecords
        .map(x=>x.fecha)
        .filter(Boolean)
    )
  ].sort().reverse();

  if(!dates.length){
    dateEl.innerHTML = `<option>Sin fechas</option>`;
    selectedDate = "";
    return;
  }

  if(!selectedDate || !dates.includes(selectedDate)){
    selectedDate = dates[0];
  }

  dateEl.innerHTML = dates
    .map(d=>`<option value="${esc(d)}">${esc(formatShortDate(d))}</option>`)
    .join("");

  dateEl.value = selectedDate;

  dateEl.onchange = ()=>{
    selectedDate = dateEl.value;
    currentDriverFilter = "";
    currentStateFilter = "TODOS";
    applySelectedDate();
  };
}

function applySelectedDate(){
  raw = allRecords.filter(x=>x.fecha===selectedDate);
  render();
}

function render(){
  renderSummary();
  renderRoutes(currentDriverFilter,currentStateFilter);
  renderUrgencies();
}

function renderSummary(){
  const m = M(raw);

  const groups = [
    ...new Set(
      raw
        .map(x=>x.responsable)
        .filter(Boolean)
    )
  ].sort((a,b)=>a.localeCompare(b,"es"));

  summaryEl.innerHTML = `
    <div class="card hero">

      <div class="muted">
        ${esc(formatDateLabel(selectedDate))}
      </div>

      <div class="total">
        ${m.t}
        <span style="font-size:17px">puntos</span>
      </div>

      <div class="stats">
        <div class="stat">
          <b>${m.d}</b>
          ✅ Completados
        </div>

        <div class="stat">
          <b>${m.p}</b>
          🔵 Pendientes
        </div>

        <div class="stat">
          <b>${m.tr}</b>
          ↪️ Trasladados
        </div>

        <div class="stat">
          <b>${m.u}</b>
          🚨 Urgencias
        </div>
      </div>

      <div
        style="text-align:left;margin-top:16px"
        class="muted"
      >
        Avance ${pct(m.d,m.t)}%
      </div>

      <div class="progress">
        <div style="width:${pct(m.d,m.t)}%"></div>
      </div>

    </div>

    <h2>🚨 Urgencias</h2>

    <div class="card">
      <b>${m.u} urgencias</b>

      <div class="muted">
        ${m.ud} completadas
        · ${m.up} pendientes
        · ${m.utr} trasladadas
      </div>
    </div>

    <h2>🚚 Transportistas</h2>

    ${
      groups.length
        ? groups.map(n=>{
            const a = raw.filter(x=>x.responsable===n);
            const q = M(a);

            return `
              <div
                class="card driver"
                onclick="driver(${JSON.stringify(n)})"
              >
                <div class="driverHead">
                  <span>${esc(n)}</span>
                  <span>${pct(q.d,q.t)}%</span>
                </div>

                <div class="meta">
                  ${q.t} puntos
                  · ${q.d} completados
                  · ${q.p} pendientes
                  · ${q.tr} trasladados
                </div>

                <div class="bar">
                  <div style="width:${pct(q.d,q.t)}%"></div>
                </div>

                <div class="meta">
                  ✅ ${q.d}
                  · 🔵 ${q.p}
                  · ↪️ ${q.tr}
                  · 🚨 ${q.u}
                </div>
              </div>
            `;
          }).join("")
        : '<div class="card muted">No hay transportistas para esta fecha.</div>'
    }
  `;
}

function renderRoutes(filter="",state="TODOS"){
  currentDriverFilter = filter;
  currentStateFilter = state;

  const names = [
    ...new Set(
      raw
        .map(x=>x.responsable)
        .filter(Boolean)
    )
  ].sort((a,b)=>a.localeCompare(b,"es"));

  const a = raw.filter(x=>{
    const driverOK =
      !filter || x.responsable===filter;

    const stateOK =
      state==="TODOS" || x.estado===state;

    return driverOK && stateOK;
  });

  routesEl.innerHTML = `
    <div class="toolbar">

      <select id="df">
        <option value="">Todos los transportistas</option>

        ${
          names
            .map(n=>`<option value="${esc(n)}">${esc(n)}</option>`)
            .join("")
        }
      </select>

      <select id="sf">
        ${
          ["TODOS","PENDIENTE","COMPLETADO","TRASLADO"]
            .map(s=>`<option value="${s}">${s}</option>`)
            .join("")
        }
      </select>

    </div>

    <h2>
      ${esc(filter || "Todos")}
      · ${a.length} puntos
    </h2>

    ${
      a.length
        ? a.map(point).join("")
        : '<div class="card muted">No hay puntos con estos filtros.</div>'
    }
  `;

  const dfEl = document.getElementById("df");
  const sfEl = document.getElementById("sf");

  dfEl.value = filter;
  sfEl.value = state;

  dfEl.onchange = ()=>{
    renderRoutes(
      dfEl.value,
      sfEl.value
    );
  };

  sfEl.onchange = ()=>{
    renderRoutes(
      dfEl.value,
      sfEl.value
    );
  };
}

function renderUrgencies(){
  urgenciesEl.innerHTML = `
    <h2>🚨 Urgencias</h2>

    <div class="toolbar">
      <button onclick="urgList('TODOS')">
        Todas
      </button>

      <button onclick="urgList('PENDIENTE')">
        Pendientes
      </button>

      <button onclick="urgList('COMPLETADO')">
        Completadas
      </button>

      <button onclick="urgList('TRASLADO')">
        Trasladadas
      </button>
    </div>

    <div id="ul"></div>
  `;

  urgList("TODOS");
}

function urgList(state){
  const a = raw.filter(x=>
    x.urgencia &&
    (
      state==="TODOS" ||
      x.estado===state
    )
  );

  const ulEl = document.getElementById("ul");

  ulEl.innerHTML =
    a.length
      ? a.map(point).join("")
      : '<div class="card muted">No hay urgencias con este filtro.</div>';
}

function driver(name){
  view(
    "routes",
    document.querySelectorAll("nav button")[1]
  );

  renderRoutes(name,"TODOS");
}

function view(id,b){
  document
    .querySelectorAll(".view")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  document
    .querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  b.classList.add("active");

  window.scrollTo(0,0);
}

async function loadData(force=false){
  refreshBtn.disabled = true;
  refreshBtn.textContent = "Actualizando…";

  try{
    const url =
      force
        ? `data.json?v=${Date.now()}`
        : "data.json";

    const response = await fetch(
      url,
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error(
        `No se pudo leer data.json (${response.status})`
      );
    }

    payload = await response.json();

    allRecords = Array.isArray(payload.records)
      ? payload.records
      : [];

    buildDateSelector();
    applySelectedDate();

    const generated =
      payload.generated_at
        ? formatTimestamp(payload.generated_at)
        : "";

    const sourceModified =
      payload.source?.modified_time
        ? formatTimestamp(payload.source.modified_time)
        : "";

    updatedEl.textContent =
      sourceModified
        ? `Excel actualizado: ${sourceModified}`
        : generated
        ? `Datos generados: ${generated}`
        : "Datos cargados";

  }catch(error){

    console.error(error);

    summaryEl.innerHTML = `
      <div class="card error">
        <b>No se pudieron cargar los datos.</b>

        <div style="margin-top:8px">
          ${esc(error.message)}
        </div>
      </div>
    `;

    routesEl.innerHTML = "";
    urgenciesEl.innerHTML = "";

    updatedEl.textContent =
      "Error al cargar data.json";

  }finally{
    refreshBtn.disabled = false;
    refreshBtn.textContent = "↻ Actualizar";
  }
}

loadData(false);
</script>

</body>
</html>
