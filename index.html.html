<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Rutas — Prototipo V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17212b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:75px}
header{background:white;padding:16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e2e7ec}
h1{font-size:20px;margin:0 0 12px}.row{display:flex;gap:8px}
select,button{font:inherit;border:1px solid #dfe5ea;border-radius:10px;background:white;padding:10px 12px}
select{flex:1}main{padding:16px}.card{background:white;border:1px solid #e2e7ec;border-radius:15px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000a}
.hero{text-align:center}.total{font-size:38px;font-weight:800}.muted{color:#687582;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}
.stat{text-align:left;border:1px solid #e2e7ec;border-radius:11px;padding:11px}.stat b{font-size:23px;display:block}
.progress{height:8px;background:#e9edf1;border-radius:20px;margin-top:9px;overflow:hidden}.progress div{height:100%;background:#238636}
h2{font-size:15px;margin:18px 2px 9px}.driver{cursor:pointer}.driverHead{display:flex;justify-content:space-between;font-weight:800}.bar{height:7px;background:#e9edf1;border-radius:20px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:#2878c8}
.meta{font-size:12px;color:#687582}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.point{border-left:4px solid #2878c8}.point.done{border-left-color:#238636}.point.transfer{border-left-color:#d88917}.point b{display:block}.badge{padding:3px 7px;border-radius:20px;background:#eef2f5;font-weight:700}.urgent{background:#fdeaea;color:#a82f2f}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e7ec;z-index:10}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}nav button{border:0;border-radius:0;padding:9px;color:#687582}nav button.active{color:#17212b;font-weight:800}
.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar>*{flex:1}
</style>
</head>
<body>
<div class="app">
<header>
<h1>🚚 Control de Rutas</h1>
<div class="row"><select id="date"><option>17/08/2026</option></select><button onclick="refresh()">↻ Actualizar</button></div>
<div id="updated" class="muted" style="margin-top:6px"></div>
</header>
<main>
<section id="summary" class="view active"></section>
<section id="routes" class="view"></section>
<section id="urgencies" class="view"></section>
</main>
</div>
<nav><div class="nav">
<button class="active" onclick="view('summary',this)">🏠<br>Resumen</button>
<button onclick="view('routes',this)">🚚<br>Rutas</button>
<button onclick="view('urgencies',this)">🚨<br>Urgencias</button>
</div></nav>
<script>
const summaryEl = document.getElementById("summary");
const routesEl = document.getElementById("routes");
const urgenciesEl = document.getElementById("urgencies");
const updatedEl = document.getElementById("updated");
const raw=[
["CARBONE","KERRY","WAGNER","","COMPLETADO","", "URUCA"],
["KERRY","ENTREGAR","WAGNER","ANTES 3PM","EN PROCESO","","PAVAS"],
["NOVEX","WESTIN","NOEL","","EN PROCESO","",""],
["CURUBANDE","WESTIN","NOEL","","COMPLETADO","",""],
["PANAPLAST","UNILEVER","WAGNER","","COMPLETADO","","URUCA"],
["CAPRIS","UNILEVER","WAGNER","","EN PROCESO","","URUCA"],
["EPA","UNILEVER","WAGNER","","COMPLETADO","",""],
["ARSA","UNILEVER","WAGNER","","EN PROCESO","","GOICOECHEA"],
["MAFISA","UNILEVER","WAGNER","","COMPLETADO","","CALLE BLANCOS"],
["SIPROFISA","UNILEVER","WAGNER","","COMPLETADO","","MORAVIA"],
["UNILEVER","ENTREGAR","WAGNER","","EN PROCESO","","BELEN"],
["SIGMA MTV","ENVIAR / CONSIGNACION","WAGNER","","COMPLETADO","",""],
["WALMART ALAJUELA","COMPRAR PANTALLA","WAGNER","","EN PROCESO","",""],
["CASA ROCHA","ENTREGAR PANTALLA","WAGNER","","EN PROCESO","",""],
["DEMASA","ENTREGAR","WAGNER","","EN PROCESO","","PAVAS"],
["FORMUQUISA","ENTREGAR","GERALD","","EN PROCESO","","PAVAS"],
["TECNOVAL","WALMART","GERALD","","COMPLETADO","","ZAPOTE"],
["WALMART","ENTREGAR / TRAMITAR","GERALD","","COMPLETADO","","COYOL"],
["UNILEVER","ENTREGAR","GERALD","","EN PROCESO","","BELEN"],
["CLOROX","ENTREGAR","GERALD","","COMPLETADO","","SAN FRANCISCO"],
["UTH CALLE BLANCOS","DEMASA","GERALD","","EN PROCESO","",""],
["DEMASA","ENTREGAR","GERALD","","EN PROCESO","","PAVAS"],
["FLORIDA","ENTREGAR","GERALD","ANTES 2:30","EN PROCESO","",""],
["QUICKLY","FLORIDA","GERALD","","EN PROCESO","","PASEO COLON"],
["HIDROCLEAR","DEVOLUCION","GERALD","","EN PROCESO","","SANTA ANA"],
["CARAZO","SIGMA ALAJUELA","GERALD","","COMPLETADO","SI","COYOL"],
["SIGMA ALAJUELA","ENTREGAR","GERALD","","COMPLETADO","SI",""],
["MAFISA","OFICINA","WAGNER","","EN PROCESO","SI","CALLE BLANCOS"],
["SUR","UNILEVER","WAGNER","","COMPLETADO","SI",""],
["UNILEVER","ENTREGAR","WAGNER","","EN PROCESO","SI","BELEN"],
["TOTAL PARTS","SIGMA CARTAGO","GERALD","","EN PROCESO","SI","PAVAS"],
["SIGMA CARTAGO","ENTREGAR","GERALD","","EN PROCESO","SI",""]
].map((r,i)=>({id:i,lugar:r[0],destino:r[1],resp:r[2],comp:r[3],estado:r[4]=="COMPLETADO"?"COMPLETADO":r[4]=="TRASLADO"?"TRASLADO":"PENDIENTE",urg:r[5]=="SI",ubic:r[6]}));

function M(a){return {t:a.length,d:a.filter(x=>x.estado=="COMPLETADO").length,p:a.filter(x=>x.estado=="PENDIENTE").length,tr:a.filter(x=>x.estado=="TRASLADO").length,u:a.filter(x=>x.urg).length,ud:a.filter(x=>x.urg&&x.estado=="COMPLETADO").length,up:a.filter(x=>x.urg&&x.estado=="PENDIENTE").length}}
function pct(a,b){return b?(a/b*100).toFixed(1):"0.0"}
function esc(s){return String(s).replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]))}
function point(x){return `<div class="card point ${x.estado=="COMPLETADO"?"done":x.estado=="TRASLADO"?"transfer":""}">
<b>${esc(x.lugar)}</b>→ ${esc(x.destino)}
<div class="chips"><span class="badge">${x.estado}</span>${x.urg?'<span class="badge urgent">🚨 URGENCIA</span>':""}${x.ubic?"<span>📍 "+esc(x.ubic)+"</span>":""}${x.comp?"<span>⏰ "+esc(x.comp)+"</span>":""}</div></div>`}
function render(){
let m=M(raw), groups=[...new Set(raw.map(x=>x.resp))];
summaryEl.innerHTML=`<div class="card hero"><div class="muted">LUN 17 AGO 2026</div><div class="total">${m.t} <span style="font-size:17px">puntos</span></div>
<div class="stats"><div class="stat"><b>${m.d}</b>✅ Completados</div><div class="stat"><b>${m.p}</b>🔵 Pendientes</div><div class="stat"><b>${m.tr}</b>↪️ Trasladados</div><div class="stat"><b>${m.u}</b>🚨 Urgencias</div></div>
<div style="text-align:left;margin-top:16px" class="muted">Avance ${pct(m.d,m.t)}%</div><div class="progress"><div style="width:${pct(m.d,m.t)}%"></div></div></div>
<h2>🚨 Urgencias</h2><div class="card"><b>${m.u} urgencias</b><div class="muted">${m.ud} completadas · ${m.up} pendientes</div></div>
<h2>🚚 Transportistas</h2>${groups.map(n=>{let a=raw.filter(x=>x.resp==n),q=M(a);return `<div class="card driver" onclick="driver('${n}')"><div class="driverHead"><span>${n}</span><span>${pct(q.d,q.t)}%</span></div><div class="meta">${q.t} puntos · ${q.d} completados · ${q.p} pendientes</div><div class="bar"><div style="width:${pct(q.d,q.t)}%"></div></div><div class="meta">✅ ${q.d} · 🔵 ${q.p} · 🚨 ${q.u}</div></div>`}).join("")}`;
renderRoutes();renderUrgencies()
}
function renderRoutes(filter="",state="TODOS"){
let a=raw.filter(x=>(!filter||x.resp==filter)&&(state=="TODOS"||x.estado==state)), names=[...new Set(raw.map(x=>x.resp))];
routesEl.innerHTML=`<div class="toolbar"><select id="df"><option value="">Todos los transportistas</option>${names.map(n=>`<option>${n}</option>`).join("")}</select><select id="sf">${["TODOS","PENDIENTE","COMPLETADO","TRASLADO"].map(s=>`<option>${s}</option>`).join("")}</select></div><h2>${filter||"Todos"} · ${a.length} puntos</h2>${a.map(point).join("")}`;
const dfEl=document.getElementById("df"), sfEl=document.getElementById("sf");
dfEl.value=filter; sfEl.value=state;
dfEl.onchange=()=>renderRoutes(dfEl.value,sfEl.value);
sfEl.onchange=()=>renderRoutes(dfEl.value,sfEl.value)
}
function renderUrgencies(){
urgenciesEl.innerHTML=`<h2>🚨 Urgencias</h2>
<div class="toolbar">
<button onclick="urgList('TODOS')">Todas</button>
<button onclick="urgList('PENDIENTE')">Pendientes</button>
<button onclick="urgList('COMPLETADO')">Completadas</button>
</div><div id="ul"></div>`;
urgList("TODOS");
}
function urgList(s){
let a=raw.filter(x=>x.urg&&(s=="TODOS"||x.estado==s));
const ulEl=document.getElementById("ul");
ulEl.innerHTML=a.map(point).join("")||'<div class="card muted">No hay urgencias.</div>';
}
function driver(n){view("routes",document.querySelectorAll("nav button")[1]);renderRoutes(n)}
function view(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");scrollTo(0,0)}
function refresh(){updatedEl.textContent="Actualizando…";setTimeout(()=>updatedEl.textContent="Última actualización: "+new Date().toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit"}),400)}
render();refresh();
</script>
</body>
</html>
